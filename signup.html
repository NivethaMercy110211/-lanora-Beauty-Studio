<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Élanora Beauty Studio </title>
  <meta name="description"
    content="Create your Élanora Beauty Studio account to enjoy seamless appointment booking, loyalty rewards, and exclusive member-only beauty offers.">
  <link rel="icon" href="assets/images/common/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/theme-dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive/target-views.css">
</head>

<body class="auth-page auth-page-signup">

  <!-- Auth Utilities -->
  <div class="eb-auth-utils">
    <button class="eb-toggle-btn" data-action="toggle-theme" title="Toggle Theme"><i
        class="bi bi-moon theme-toggle-icon"></i></button>
    <button class="eb-toggle-btn" data-action="toggle-dir" title="Toggle RTL"><span
        class="rtl-toggle-label eb-rtl-label">RTL</span></button>
  </div>

  <div class="eb-auth-wrapper">
    <div class="eb-auth-bg" style="background-image:url('assets/images/pages/salon-1.jpg');"></div>
    <div class="eb-auth-overlay"
      style="background:linear-gradient(135deg,rgba(24,20,18,0.8) 0%,rgba(90,64,55,0.65) 100%);"></div>

    <div class="eb-auth-card">

      <!-- Brand -->
      <a href="index.html" class="eb-auth-brand">
        <div class="eb-auth-brand-badge"><img src="assets/images/common/logo.png" alt="Élanora Beauty Studio Logo">
        </div>
        <div class="eb-auth-brand-text">
          <span class="eb-auth-brand-name">Élanora</span>
          <span class="eb-auth-brand-tagline">BEAUTY STUDIO</span>
        </div>
      </a>

      <h2 class="eb-auth-title">Create Your Account</h2>
      <p class="eb-auth-subtitle">Join Élanora to enjoy priority booking, loyalty rewards, and exclusive member offers.
      </p>



      <!-- Signup Form -->
      <form id="signupForm" novalidate>
        <div class="eb-form-row">
          <div class="eb-form-group">
            <label class="eb-form-label" for="signupFirstName">First Name <span class="required">*</span></label>
            <input type="text" id="signupFirstName" class="eb-form-control" placeholder="Priya" required>
          </div>
          <div class="eb-form-group">
            <label class="eb-form-label" for="signupLastName">Last Name <span class="required">*</span></label>
            <input type="text" id="signupLastName" class="eb-form-control" placeholder="Sharma" required>
          </div>
        </div>

        <div class="eb-form-group">
          <label class="eb-form-label" for="signupEmail">Email Address <span class="required">*</span></label>
          <input type="email" id="signupEmail" class="eb-form-control" placeholder="your@email.com" required>
        </div>

        <div class="eb-form-group">
          <label class="eb-form-label" for="signupPhone">Phone Number <span class="required">*</span></label>
          <input type="tel" id="signupPhone" class="eb-form-control" placeholder="+91 98765 43210" required>
        </div>

        <div class="eb-form-group">
          <label class="eb-form-label" for="signupPassword">Password <span class="required">*</span></label>
          <div class="eb-password-field">
            <input type="password" id="signupPassword" class="eb-form-control" placeholder="Create a strong password"
              required minlength="8">
            <button type="button" class="eb-password-toggle" aria-label="Show password"><i
                class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="eb-form-group">
          <label class="eb-form-label" for="signupConfirmPassword">Confirm Password <span
              class="required">*</span></label>
          <div class="eb-password-field">
            <input type="password" id="signupConfirmPassword" class="eb-form-control" placeholder="Repeat your password"
              required>
            <button type="button" class="eb-password-toggle" aria-label="Show confirm password"><i
                class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="eb-form-group">
          <label class="eb-form-check">
            <input type="checkbox" id="signupAgree" required>
            <span class="eb-form-check-label">I agree to the <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a>. <span class="required">*</span></span>
          </label>
        </div>

        <button type="submit" class="eb-btn eb-btn-primary eb-btn-lg w-100 mb-4">
          <i class="bi bi-person-check"></i> Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="eb-auth-divider"><span>or sign up with</span></div>

      <!-- Third-Party Auth -->
      <div class="eb-social-auth">
        <button class="eb-social-btn" type="button" aria-label="Sign up with Apple">
          <span class="social-icon apple"><i class="bi bi-apple"></i></span>
          <span>Sign up with Apple</span>
        </button>
        <button class="eb-social-btn" type="button" aria-label="Sign up with Google">
          <svg class="social-svg-icon" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.36 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29C.47 8.21 0 10.05 0 12s.47 3.79 1.29 5.42l3.99-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Sign up with Google</span>
        </button>
        <button class="eb-social-btn" type="button" aria-label="Sign up with Facebook">
          <span class="social-icon facebook"><i class="bi bi-facebook"></i></span>
          <span>Sign up with Facebook</span>
        </button>
      </div>

      <p class="eb-auth-footer-text">Already have an account? <a href="login.html">Sign in here</a></p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
