<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Élanora Beauty Studio </title>
  <meta name="description"
    content="Sign in to your Élanora Beauty Studio account to manage appointments, loyalty points, and exclusive member offers.">
  <link rel="icon" href="assets/images/common/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/theme-dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive/target-views.css">
</head>

<body class="auth-page auth-page-login">

  <!-- Auth Utilities Bar -->
  <div class="eb-auth-utils">
    <button class="eb-toggle-btn" data-action="toggle-theme" title="Toggle Theme"><i
        class="bi bi-moon theme-toggle-icon"></i></button>
    <button class="eb-toggle-btn" data-action="toggle-dir" title="Toggle RTL"><span
        class="rtl-toggle-label eb-rtl-label">RTL</span></button>
  </div>

  <!-- Auth Wrapper -->
  <div class="eb-auth-wrapper">
    <div class="eb-auth-bg" style="background-image:url('assets/images/pages/inside-studio.jpg');"></div>
    <div class="eb-auth-overlay"></div>

    <div class="eb-auth-card">

      <!-- Brand -->
      <a href="index.html" class="eb-auth-brand">
        <div class="eb-auth-brand-badge"><img src="assets/images/common/logo.png" alt="Élanora Beauty Studio Logo">
        </div>
        <div class="eb-auth-brand-text">
          <span class="eb-auth-brand-name">Élanora</span>
          <span class="eb-auth-brand-tagline">BEAUTY STUDIO</span>
        </div>
      </a>

      <h2 class="eb-auth-title">Welcome Back</h2>
      <p class="eb-auth-subtitle">Sign in to your Élanora account to manage your appointments and loyalty points.</p>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="eb-form-group">
          <label class="eb-form-label" for="loginEmail">Email Address <span class="required">*</span></label>
          <input type="email" id="loginEmail" class="eb-form-control" placeholder="your@email.com" required>
        </div>

        <div class="eb-form-group">
          <label class="eb-form-label" for="loginPassword">Password <span class="required">*</span></label>
          <div class="eb-password-field">
            <input type="password" id="loginPassword" class="eb-form-control" placeholder="Enter your password"
              required>
            <button type="button" class="eb-password-toggle" aria-label="Toggle password visibility"><i
                class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-3">
          <label class="eb-form-check">
            <input type="checkbox" id="rememberMe">
            <span class="eb-form-check-label">Remember me</span>
          </label>
          <a href="forgot-password.html"
            style="font-size:var(--fs-small);color:var(--color-primary);text-decoration:none;font-weight:var(--fw-medium);">Forgot
            Password?</a>
        </div>

        <button type="submit" class="eb-btn eb-btn-primary eb-btn-lg w-100 mb-4" id="loginSubmit">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="eb-auth-divider"><span>or continue with</span></div>

      <!-- Third-Party Auth -->
      <div class="eb-social-auth">
        <button class="eb-social-btn" type="button" aria-label="Sign in with Apple">
          <span class="social-icon apple"><i class="bi bi-apple"></i></span>
          <span>Sign in with Apple</span>
        </button>
        <button class="eb-social-btn" type="button" aria-label="Sign in with Google">
          <svg class="social-svg-icon" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.36 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29C.47 8.21 0 10.05 0 12s.47 3.79 1.29 5.42l3.99-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>
        <button class="eb-social-btn" type="button" aria-label="Sign in with Facebook">
          <span class="social-icon facebook"><i class="bi bi-facebook"></i></span>
          <span>Sign in with Facebook</span>
        </button>
      </div>

      <!-- Auth Footer -->
      <p class="eb-auth-footer-text">Don't have an account? <a href="signup.html">Create one here</a></p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
